<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Web Test Recorder</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    
    h3 {
      margin: 0 0 12px 0;
      color: #333;
    }
    
    #status {
      padding: 8px;
      margin-bottom: 16px;
      background-color: #f0f0f0;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
    }
    
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    #startBtn {
      background-color: #4CAF50;
      color: white;
    }
    
    #startBtn:hover:not(:disabled) {
      background-color: #45a049;
    }
    
    #stopBtn {
      background-color: #f44336;
      color: white;
    }
    
    #stopBtn:hover:not(:disabled) {
      background-color: #da190b;
    }
    
    #downloadBtn {
      background-color: #2196F3;
      color: white;
    }
    
    #downloadBtn:hover:not(:disabled) {
      background-color: #0b7dda;
    }
    
    #debugBtn {
      background-color: #FF9800;
      color: white;
      font-size: 12px;
      padding: 6px;
    }
    
    #debugBtn:hover {
      background-color: #e68900;
    }
    
    #debugInfo {
      margin-top: 12px;
      padding: 8px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    
    #debugInfo pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .recording {
      background-color: #ffebee !important;
      border: 1px solid #f44336;
    }
  </style>
</head>
<body>
  <h3>Web Test Recorder</h3>
  
  <div id="status">Not recording</div>
  
  <button id="startBtn">Start Recording</button>
  <button id="stopBtn" disabled>Stop Recording</button>
  <button id="downloadBtn" disabled>Download JSON</button>
  <button id="debugBtn">Show Debug Info</button>
  
  <div id="debugInfo"></div>
  
  <script src="popup.js"></script>
</body>
</html>
